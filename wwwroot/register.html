<!doctype html><html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Đăng ký | Medika</title><link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;600;700&family=Space+Grotesk:wght@600;700&display=swap" rel="stylesheet"><link rel="stylesheet" href="/auth.css"></head><body><main class="auth-shell"><div class="brand"><span class="brand-mark">+</span> medika</div><h1>Tạo tài khoản</h1><p class="subtitle">Tài khoản mới được tạo kèm hồ sơ bệnh nhân.</p><form id="register-form"><label>Họ và tên<input id="full-name" required maxlength="100"></label><label>Email<input id="email" type="email" required maxlength="150"></label><label>Ngày sinh<input id="date-of-birth" type="date" required></label><label>Số điện thoại<input id="phone" type="tel" required></label><label>Địa chỉ<input id="address" required maxlength="250"></label><label>Tên đăng nhập<input id="username" required minlength="3" maxlength="40" autocomplete="username"></label><label>Mật khẩu<input id="password" type="password" required minlength="8" autocomplete="new-password"></label><button type="submit">Đăng ký</button><p id="message" class="message"></p></form><p class="switch">Đã có tài khoản? <a href="/login.html">Đăng nhập</a></p></main><script src="/auth.js"></script></body></html>
