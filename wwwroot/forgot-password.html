<!doctype html><html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Quên mật khẩu | Medika</title><link rel="stylesheet" href="/auth.css"></head><body><main class="auth-shell"><div class="brand"><span class="brand-mark">+</span> medika</div><h1>Khôi phục tài khoản</h1><p class="subtitle">Nhập tên đăng nhập hoặc email. Hệ thống không tiết lộ tài khoản có tồn tại hay không.</p><form id="forgot-form"><label>Tên đăng nhập hoặc email<input id="username-or-email" required></label><button type="submit">Gửi yêu cầu</button><p id="message" class="message"></p></form><p class="switch"><a href="/login.html">Quay lại đăng nhập</a></p></main><script>document.querySelector('#forgot-form').addEventListener('submit',async event=>{event.preventDefault();const response=await fetch('/api/auth/forgot-password',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({usernameOrEmail:document.querySelector('#username-or-email').value})});const data=await response.json();document.querySelector('#message').textContent=data.message;});</script></body></html>
