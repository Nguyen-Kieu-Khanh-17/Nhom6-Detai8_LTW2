<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Đăng nhập | Medika Clinic</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;600;700&family=Space+Grotesk:wght@600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/auth.css">
  <link rel="stylesheet" href="/chatbot.css">
  <style>
    .quick-login-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 8px;
      margin-top: 14px;
      margin-bottom: 18px;
    }
    .quick-btn {
      background: #f1f5f9;
      border: 1px solid #cbd5e1;
      border-radius: 8px;
      padding: 8px;
      font-size: 0.8rem;
      font-weight: 600;
      color: #1e293b;
      cursor: pointer;
      display: flex;
      flex-direction: column;
      align-items: flex-start;
      gap: 2px;
      transition: all 0.15s;
    }
    .quick-btn:hover {
      background: #e2e8f0;
      border-color: #94a3b8;
    }
    .quick-btn span { font-size: 0.72rem; color: #64748b; font-weight: normal; }
  </style>
</head>
<body>
  <main class="auth-shell">
    <div class="brand"><span class="brand-mark">+</span> medika</div>
    <h1>Đăng nhập hệ thống</h1>
    <p class="subtitle">Hệ thống Quản lý và Đặt lịch Phòng khám Đa khoa thông minh tích hợp AI.</p>

    <!-- Nút đăng nhập mẫu 1-click -->
    <div style="margin-bottom:6px;">
      <small style="color:#64748b;font-weight:600;text-transform:uppercase;font-size:0.75rem;">Chọn nhanh tài khoản mẫu:</small>
    </div>
    <div class="quick-login-grid">
      <button class="quick-btn" type="button" onclick="quickFill('admin', 'admin123')">
        👑 Quản trị viên
        <span>admin / admin123</span>
      </button>
      <button class="quick-btn" type="button" onclick="quickFill('doctor', 'doctor123')">
        👨‍⚕️ Bác sĩ trực
        <span>doctor / doctor123</span>
      </button>
      <button class="quick-btn" type="button" onclick="quickFill('letu', 'receptionist123')">
        👩‍💼 Bàn Lễ tân
        <span>letu / receptionist123</span>
      </button>
      <button class="quick-btn" type="button" onclick="quickFill('support', 'support123')">
        🎧 Hỗ trợ CSKH
        <span>support / support123</span>
      </button>
      <button class="quick-btn" type="button" style="grid-column: span 2;" onclick="quickFill('user', 'user123')">
        🧑‍🦱 Bệnh nhân demo
        <span>user / user123</span>
      </button>
    </div>

    <form id="login-form">
      <label>Tên đăng nhập
        <input id="username" required autocomplete="username" placeholder="Nhập username">
      </label>
      <label>Mật khẩu
        <input id="password" type="password" required autocomplete="current-password" placeholder="Nhập mật khẩu">
      </label>
      <button type="submit">Đăng nhập</button>
      <p id="message" class="message"></p>
    </form>

    <p class="switch"><a href="/forgot-password.html">Quên mật khẩu?</a></p>
    <p class="switch">Chưa có tài khoản? <a href="/register.html">Đăng ký người dùng mới</a></p>
  </main>

  <script src="/auth.js"></script>
  <script src="/chatbot.js"></script>
  <script>
    function quickFill(u, p) {
      document.querySelector('#username').value = u;
      document.querySelector('#password').value = p;
      document.querySelector('#login-form button[type="submit"]').click();
    }
  </script>
</body>
</html>
